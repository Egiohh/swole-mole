<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121212">
  <title>Swole Mole</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/app-192.png">
  <link rel="apple-touch-icon" href="icons/app-192.png">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="top">
    <img src="icons/app-192.png" alt="">
    <h1>Swole Mole</h1>
  </header>
  <ul id="list"></ul>
  <section id="more" hidden></section>
  <section id="daytab" hidden></section>
  <nav class="tabs">
    <button data-tab="today" class="on"><span>🏋️</span>Today</button>
    <button data-tab="more"><span>➕</span>More</button>
    <button data-tab="day"><span>📝</span>Day <b id="badge" hidden></b></button>
  </nav>
  <section id="detail" hidden></section>
  <div id="rest" hidden></div>
</body>
</html>
